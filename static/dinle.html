<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canlı Kulaklık Kanalı (TR / EN / FR / DE) | İklim Adaleti Forumu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #09100d; color: #f0fdf4; padding: 16px; max-width: 640px; margin: 0 auto; }
    .header { border-bottom: 1px solid #1e3a2f; padding-bottom: 12px; margin-bottom: 14px; }
    .tag { font-size: 12px; color: #4ade80; font-weight: 700; text-transform: uppercase; }
    .title { font-size: 18px; font-weight: 800; margin-top: 4px; }
    .channels { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; margin-bottom: 12px; }
    .ch-btn {
      padding: 10px 6px;
      border-radius: 10px;
      border: 2px solid #234235;
      background: #13221c;
      color: #f0fdf4;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }
    .ch-btn.active {
      border-color: #eab308;
      background: #eab308;
      color: #1c1917;
    }
    .audio-btn {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      background: #22c55e;
      color: #052e16;
      margin-bottom: 16px;
    }
    .audio-btn.active {
      background: #ef4444;
      color: #ffffff;
    }
    .stream { display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: #13221c;
      border-left: 4px solid #22c55e;
      padding: 12px 14px;
      border-radius: 8px;
    }
    .src { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .target { font-size: 18px; font-weight: 700; color: #fef08a; line-height: 1.35; }
  </style>
</head>
<body>
  <div class="header">
    <div class="tag">COP31 • CLIMATE JUSTICE FORUM • ANTALYA</div>
    <div class="title" id="sessionTitle">4-Channel Simultaneous Interpretation</div>
  </div>

  <div class="channels" style="grid-template-columns: repeat(5, 1fr);">
    <button id="ch-tr" class="ch-btn active" onclick="selectChannel('tr')">🇹🇷 Türkçe<br><small>Kanal 1</small></button>
    <button id="ch-en" class="ch-btn" onclick="selectChannel('en')">🇬🇧 English<br><small>Channel 2</small></button>
    <button id="ch-fr" class="ch-btn" onclick="selectChannel('fr')">🇫🇷 Français<br><small>Canal 3</small></button>
    <button id="ch-de" class="ch-btn" onclick="selectChannel('de')">🇩🇪 Deutsch<br><small>Kanal 4</small></button>
    <button id="ch-th" class="ch-btn" onclick="selectChannel('th')">🇹🇭 ไทย<br><small>Ch 5</small></button>
  </div>

  <div style="background:#451a03; border:1px solid #f59e0b; color:#fef3c7; padding:10px 12px; border-radius:10px; font-size:12px; line-height:1.45; margin-bottom:10px;">
    <div style="font-weight:800; color:#fbbf24; margin-bottom:4px;">⚠️ KULAKLIK ZORUNLUDUR / HEADPHONES REQUIRED</div>
    <div>Salonda ses karışmaması için lütfen hoparlör yerine kulaklık kullanın.</div>
    <label style="display:flex; align-items:center; gap:8px; margin-top:8px; font-weight:700; color:#fff; cursor:pointer;">
      <input type="checkbox" id="headphoneChk" style="width:18px; height:18px; accent-color:#22c55e;">
      <span>🎧 Kulaklığımı taktım / Headphones connected</span>
    </label>
  </div>

  <button id="audioBtn" class="audio-btn" onclick="toggleAudio()">
    🎧 Sesli Dinle / Start Audio / Écouter / Audio starten
  </button>

  <div id="stream" class="stream"></div>

  <script>
    const BASE = location.pathname.startsWith('/ceviri') ? '/ceviri' : '';
    let currentChannel = 'tr'; // tr | en | fr | de | th
    let audioEnabled = false;
    let audioQueue = [];
    let isPlaying = false;
    let currentItem = null;
    let currentBlobUrl = null;
    let allHistory = [];
    let ws = null;
    let wakeLock = null;
    let keepAliveCtx = null;
    const player = new Audio();
    player.setAttribute('playsinline', '');

    const LANG_LOCALE = { tr: 'tr-TR', en: 'en-US', fr: 'fr-FR', de: 'de-DE', th: 'th-TH' };

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator && audioEnabled) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) {}
    }

    function releaseWakeLock() {
      try {
        if (wakeLock) { wakeLock.release(); wakeLock = null; }
      } catch (e) {}
    }

    function startKeepAlive() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC && !keepAliveCtx) {
          keepAliveCtx = new AC();
          const osc = keepAliveCtx.createOscillator();
          const gain = keepAliveCtx.createGain();
          gain.gain.value = 0.00001; // inaudible keep-alive so mobile OS keeps audio & WS alive on lock screen
          osc.connect(gain);
          gain.connect(keepAliveCtx.destination);
          osc.start();
        }
        if (keepAliveCtx && keepAliveCtx.state === 'suspended') {
          keepAliveCtx.resume().catch(() => {});
        }
      } catch (e) {}
      try {
        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = new MediaMetadata({
            title: 'COP31 Live Interpretation',
            artist: currentChannel.toUpperCase() + ' Channel',
            album: 'Iklim Adaleti Forumu',
          });
          navigator.mediaSession.setActionHandler('play', () => { if (!audioEnabled) toggleAudio(); });
          navigator.mediaSession.setActionHandler('pause', () => { if (audioEnabled) toggleAudio(); });
        }
      } catch (e) {}
    }

    function stopKeepAlive() {
      try {
        if (keepAliveCtx) { keepAliveCtx.close(); keepAliveCtx = null; }
      } catch (e) {}
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) {
        if (audioEnabled) {
          requestWakeLock();
          if (keepAliveCtx && keepAliveCtx.state === 'suspended') keepAliveCtx.resume().catch(() => {});
        }
        if (!ws || ws.readyState > 1) connectWS();
      }
    });

    function fallbackBrowserSpeak(item) {
      if (!item || !('speechSynthesis' in window)) {
        isPlaying = false;
        playNext();
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(item.text);
        u.lang = LANG_LOCALE[item.lang] || 'tr-TR';
        u.rate = 1.12;
        u.onend = () => { isPlaying = false; playNext(); };
        u.onerror = () => { isPlaying = false; playNext(); };
        window.speechSynthesis.speak(u);
      } catch (e) {
        isPlaying = false;
        playNext();
      }
    }

    function releaseCurrentBlob() {
      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
        currentBlobUrl = null;
      }
    }

    player.onended = () => { releaseCurrentBlob(); isPlaying = false; playNext(); };
    player.onerror = () => { releaseCurrentBlob(); fallbackBrowserSpeak(currentItem); };

    function selectChannel(ch) {
      currentChannel = ch;
      ['tr', 'en', 'fr', 'de', 'th'].forEach(c => {
        document.getElementById('ch-' + c).className = c === ch ? 'ch-btn active' : 'ch-btn';
      });
      if (ch === 'th' && ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ type: 'thai_listener' }));
      }
      audioQueue.forEach(it => { if (it.blobUrl) URL.revokeObjectURL(it.blobUrl); });
      audioQueue = [];
      player.pause();
      releaseCurrentBlob();
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      isPlaying = false;
      renderAll();
    }

    function toggleAudio() {
      if (!audioEnabled) {
        const chk = document.getElementById('headphoneChk');
        if (chk && !chk.checked) {
          alert('⚠️ Lütfen önce kulaklığınızı takıp "Kulaklığımı taktım" kutusunu işaretleyin.\n\nPlease wear headphones and check the box first.');
          return;
        }
      }
      audioEnabled = !audioEnabled;
      const btn = document.getElementById('audioBtn');
      if (audioEnabled) {
        btn.className = 'audio-btn active';
        btn.textContent = '⏹️ Sesi Kapat / Stop Audio / Arrêter / Stopp';
        requestWakeLock();
        startKeepAlive();
        const greet = {
          tr: 'Türkçe simultane ses kanalı aktif.',
          en: 'English simultaneous audio channel active.',
          fr: 'Canal audio simultané français actif.',
          de: 'Deutscher Simultanaudiokanal aktiv.',
          th: 'เปิดใช้งานช่องเสียงล่ามภาษาไทยแล้ว'
        }[currentChannel];
        enqueueSpeech(greet, currentChannel);
      } else {
        btn.className = 'audio-btn';
        btn.textContent = '🎧 Sesli Dinle / Start Audio / Écouter / Audio starten';
        audioQueue.forEach(it => { if (it.blobUrl) URL.revokeObjectURL(it.blobUrl); });
        audioQueue = [];
        player.pause();
        releaseCurrentBlob();
        releaseWakeLock();
        stopKeepAlive();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        isPlaying = false;
      }
    }

    function prefetchAudio(item) {
      const url = `${BASE}/api/tts?lang=${encodeURIComponent(item.lang)}&text=${encodeURIComponent(item.text)}`;
      item.url = url;
      item.readyPromise = fetch(url)
        .then(r => r.ok ? r.blob() : null)
        .then(blob => {
          if (blob && blob.size > 0) item.blobUrl = URL.createObjectURL(blob);
        })
        .catch(() => {});
    }

    function enqueueSpeech(text, lang) {
      if (!audioEnabled || !text) return;
      // Keep up to 3 queued clips and prefetch audio so there is zero gap between sentences
      while (audioQueue.length >= 3) {
        const dropped = audioQueue.shift();
        if (dropped && dropped.blobUrl) URL.revokeObjectURL(dropped.blobUrl);
      }
      const item = { text, lang, blobUrl: null, url: '', readyPromise: null };
      prefetchAudio(item);
      audioQueue.push(item);
      playNext();
    }

    async function playNext() {
      if (isPlaying || audioQueue.length === 0 || !audioEnabled) return;
      isPlaying = true;
      currentItem = audioQueue.shift();
      if (currentItem.readyPromise && !currentItem.blobUrl) {
        await Promise.race([currentItem.readyPromise, new Promise(r => setTimeout(r, 900))]);
      }
      if (!audioEnabled) { isPlaying = false; return; }
      currentBlobUrl = currentItem.blobUrl || null;
      player.src = currentBlobUrl || currentItem.url;
      player.playbackRate = audioQueue.length >= 2 ? 1.24 : audioQueue.length === 1 ? 1.16 : 1.06;
      player.play().catch(() => { releaseCurrentBlob(); fallbackBrowserSpeak(currentItem); });
    }

    function renderAll() {
      const stream = document.getElementById('stream');
      stream.innerHTML = '';
      allHistory.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card';
        const srcDiv = document.createElement('div');
        srcDiv.className = 'src';
        srcDiv.textContent = item.source || '';
        const tgtDiv = document.createElement('div');
        tgtDiv.className = 'target';
        tgtDiv.textContent = item[currentChannel] || item.tr || '';
        div.appendChild(srcDiv);
        div.appendChild(tgtDiv);
        stream.prepend(div);
      });
    }

    function onNewSubtitle(item, speak) {
      if (!item.is_final) return;
      allHistory.push(item);
      if (allHistory.length > 30) allHistory.shift();
      renderAll();
      if (speak) {
        const targetText = item[currentChannel];
        enqueueSpeech(targetText, currentChannel);
      }
    }

    function connectWS() {
      if (ws && (ws.readyState === 0 || ws.readyState === 1)) return;
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${proto}//${location.host}${BASE}/ws`);
      ws.onopen = () => {
        if (currentChannel === 'th') {
          ws.send(JSON.stringify({ type: 'thai_listener' }));
        }
      };
      ws.onmessage = (ev) => {
        const data = JSON.parse(ev.data);
        if (data.type === 'init') {
          if (data.session) document.getElementById('sessionTitle').textContent = data.session.title;
          allHistory = [];
          (data.history || []).forEach(x => onNewSubtitle(x, false));
        } else if (data.type === 'session_update') {
          if (data.session) document.getElementById('sessionTitle').textContent = data.session.title;
        } else if (data.type === 'subtitle') {
          onNewSubtitle(data, true);
        } else if (data.type === 'clear') {
          allHistory = [];
          document.getElementById('stream').innerHTML = '';
        }
      };
      ws.onclose = () => {
        ws = null;
        setTimeout(connectWS, 1000 + Math.floor(Math.random() * 2000));
      };
    }

    connectWS();
  </script>
</body>
</html>
