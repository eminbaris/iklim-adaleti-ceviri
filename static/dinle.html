<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canlı Kulaklık Kanalı (TR / EN / FR / DE) | İklim Adaleti Forumu</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #09100d; color: #f0fdf4; padding: 16px; max-width: 640px; margin: 0 auto; }
    .header { border-bottom: 1px solid #1e3a2f; padding-bottom: 12px; margin-bottom: 14px; }
    .tag { font-size: 12px; color: #4ade80; font-weight: 700; text-transform: uppercase; }
    .title { font-size: 18px; font-weight: 800; margin-top: 4px; }
    .channels { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; margin-bottom: 12px; }
    .ch-btn {
      padding: 10px 6px;
      border-radius: 10px;
      border: 2px solid #234235;
      background: #13221c;
      color: #f0fdf4;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }
    .ch-btn.active {
      border-color: #eab308;
      background: #eab308;
      color: #1c1917;
    }
    .audio-btn {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      background: #22c55e;
      color: #052e16;
      margin-bottom: 16px;
    }
    .audio-btn.active {
      background: #ef4444;
      color: #ffffff;
    }
    .stream { display: flex; flex-direction: column; gap: 10px; }
    .card {
      background: #13221c;
      border-left: 4px solid #22c55e;
      padding: 12px 14px;
      border-radius: 8px;
    }
    .src { font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
    .target { font-size: 18px; font-weight: 700; color: #fef08a; line-height: 1.35; }
  </style>
</head>
<body>
  <div class="header">
    <div class="tag">COP31 • CLIMATE JUSTICE FORUM • ANTALYA</div>
    <div class="title" id="sessionTitle">4-Channel Simultaneous Interpretation</div>
  </div>

  <div class="channels">
    <button id="ch-tr" class="ch-btn active" onclick="selectChannel('tr')">🇹🇷 Türkçe<br><small>Kanal 1</small></button>
    <button id="ch-en" class="ch-btn" onclick="selectChannel('en')">🇬🇧 English<br><small>Channel 2</small></button>
    <button id="ch-fr" class="ch-btn" onclick="selectChannel('fr')">🇫🇷 Français<br><small>Canal 3</small></button>
    <button id="ch-de" class="ch-btn" onclick="selectChannel('de')">🇩🇪 Deutsch<br><small>Kanal 4</small></button>
  </div>

  <button id="audioBtn" class="audio-btn" onclick="toggleAudio()">
    🎧 Sesli Dinle / Start Audio / Écouter / Audio starten
  </button>

  <div id="stream" class="stream"></div>

  <script>
    const BASE = location.pathname.startsWith('/ceviri') ? '/ceviri' : '';
    let currentChannel = 'tr'; // tr | en | fr | de
    let audioEnabled = false;
    let audioQueue = [];
    let isPlaying = false;
    let allHistory = [];
    const player = new Audio();

    player.onended = () => { isPlaying = false; playNext(); };
    player.onerror = () => { isPlaying = false; playNext(); };

    function selectChannel(ch) {
      currentChannel = ch;
      ['tr', 'en', 'fr', 'de'].forEach(c => {
        document.getElementById('ch-' + c).className = c === ch ? 'ch-btn active' : 'ch-btn';
      });
      audioQueue = [];
      player.pause();
      isPlaying = false;
      renderAll();
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      const btn = document.getElementById('audioBtn');
      if (audioEnabled) {
        btn.className = 'audio-btn active';
        btn.textContent = '⏹️ Sesi Kapat / Stop Audio / Arrêter / Stopp';
        const greet = {
          tr: 'Türkçe simultane ses kanalı aktif.',
          en: 'English simultaneous audio channel active.',
          fr: 'Canal audio simultané français actif.',
          de: 'Deutscher Simultanaudiokanal aktiv.'
        }[currentChannel];
        enqueueSpeech(greet, currentChannel);
      } else {
        btn.className = 'audio-btn';
        btn.textContent = '🎧 Sesli Dinle / Start Audio / Écouter / Audio starten';
        audioQueue = [];
        player.pause();
        isPlaying = false;
      }
    }

    function enqueueSpeech(text, lang) {
      if (!audioEnabled || !text) return;
      audioQueue.push({ text, lang });
      playNext();
    }

    function playNext() {
      if (isPlaying || audioQueue.length === 0 || !audioEnabled) return;
      isPlaying = true;
      const item = audioQueue.shift();
      player.src = `${BASE}/api/tts?lang=${encodeURIComponent(item.lang)}&text=${encodeURIComponent(item.text)}`;
      player.play().catch(() => { isPlaying = false; });
    }

    function renderAll() {
      const stream = document.getElementById('stream');
      stream.innerHTML = '';
      allHistory.forEach(item => {
        const div = document.createElement('div');
        div.className = 'card';
        const srcDiv = document.createElement('div');
        srcDiv.className = 'src';
        srcDiv.textContent = item.source || '';
        const tgtDiv = document.createElement('div');
        tgtDiv.className = 'target';
        tgtDiv.textContent = item[currentChannel] || item.tr || '';
        div.appendChild(srcDiv);
        div.appendChild(tgtDiv);
        stream.prepend(div);
      });
    }

    function onNewSubtitle(item, speak) {
      if (!item.is_final) return;
      allHistory.push(item);
      if (allHistory.length > 30) allHistory.shift();
      renderAll();
      if (speak) {
        const targetText = item[currentChannel];
        enqueueSpeech(targetText, currentChannel);
      }
    }

    function connectWS() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${proto}//${location.host}${BASE}/ws`);
      ws.onmessage = (ev) => {
        const data = JSON.parse(ev.data);
        if (data.type === 'init') {
          if (data.session) document.getElementById('sessionTitle').textContent = data.session.title;
          allHistory = [];
          (data.history || []).forEach(x => onNewSubtitle(x, false));
        } else if (data.type === 'session_update') {
          if (data.session) document.getElementById('sessionTitle').textContent = data.session.title;
        } else if (data.type === 'subtitle') {
          onNewSubtitle(data, true);
        } else if (data.type === 'clear') {
          allHistory = [];
          document.getElementById('stream').innerHTML = '';
        }
      };
      ws.onclose = () => setTimeout(connectWS, 1500);
    }

    connectWS();
  </script>
</body>
</html>
